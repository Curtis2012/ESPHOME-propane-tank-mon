substitutions:
  name: propane-tank-monitor
  friendly_name: Propane Tank Monitor
  dout_pin: GPIO4
  clk_pin: GPIO5
  update_period_default_s: "5"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: huzzah

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

web_server:
  port: 80

globals:
  - id: last_hx711_update_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: tare_offset_kg
    type: float
    restore_value: yes
    initial_value: "0.0"

select:
  - platform: template
    name: "Active Tank"
    id: active_tank_profile
    optimistic: true
    restore_value: true
    initial_option: "Tank 1"
    options:
      - "Tank 1"
      - "Tank 2"

switch:
  - platform: template
    name: "Calibration Mode"
    id: calibration_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Tare Scale"
    id: tare_scale
    on_press:
      - lambda: |-
          if (isnan(id(tank_weight_kg).state)) {
            ESP_LOGW("tare", "Tare requested but current weight is not available yet");
            return;
          }
          id(tare_offset_kg) -= id(tank_weight_kg).state;
          ESP_LOGI("tare", "Tare applied. New tare offset: %.4f kg", id(tare_offset_kg));
          id(tank_weight_kg).update();

number:
  - platform: template
    name: "Tank 1 Tare Weight"
    id: tank_1_tare_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 200
    step: 0.1
    initial_value: 5.8967
  - platform: template
    name: "Tank 1 Capacity"
    id: tank_1_capacity
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 0.1
    initial_value: 11.3398
  - platform: template
    name: "Tank 1 Regulator Weight"
    id: tank_1_regulator_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 20
    step: 0.01
    initial_value: 0.5
  - platform: template
    name: "Tank 2 Tare Weight"
    id: tank_2_tare_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 200
    step: 0.1
    initial_value: 5.8967
  - platform: template
    name: "Tank 2 Capacity"
    id: tank_2_capacity
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 0.1
    initial_value: 11.3398
  - platform: template
    name: "Tank 2 Regulator Weight"
    id: tank_2_regulator_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 20
    step: 0.01
    initial_value: 0.5
  - platform: template
    name: "Calibration Offset"
    id: calibration_offset_kg
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: -50
    max_value: 50
    step: 0.0001
    initial_value: 0.0
  - platform: template
    name: "Sensor Update Period"
    id: sensor_update_period_s
    unit_of_measurement: s
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 3600
    step: 1
    initial_value: ${update_period_default_s}

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t period_ms = (uint32_t) (id(sensor_update_period_s).state * 1000.0f);
          const uint32_t safe_period_ms = period_ms < 1000 ? 1000 : period_ms;
          if ((now - id(last_hx711_update_ms)) >= safe_period_ms) {
            id(last_hx711_update_ms) = now;
            id(tank_weight_kg).update();
          }

sensor:
  - platform: hx711
    id: tank_weight_kg
    name: "Tank Weight"
    dout_pin: ${dout_pin}
    clk_pin: ${clk_pin}
    gain: 128
    update_interval: never
    unit_of_measurement: kg
    accuracy_decimals: 2
    filters:
      - calibrate_linear:
          - 100000.0 -> 0.0
          - 120000.0 -> 10.0
      - lambda: |-
          float adjusted = x;
          if (id(calibration_mode).state) {
            adjusted += id(calibration_offset_kg).state;
          }
          adjusted += id(tare_offset_kg);
          if (adjusted < 0) {
            return 0.0f;
          }
          return adjusted;
  - platform: template
    name: "Propane Remaining"
    unit_of_measurement: kg
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      const float weight = id(tank_weight_kg).state;
      const bool tank_2_active = id(active_tank_profile).current_option() == "Tank 2";
      const float tare_weight = tank_2_active ? id(tank_2_tare_weight).state : id(tank_1_tare_weight).state;
      const float capacity = tank_2_active ? id(tank_2_capacity).state : id(tank_1_capacity).state;
      const float regulator = tank_2_active ? id(tank_2_regulator_weight).state : id(tank_1_regulator_weight).state;
      if (isnan(weight) || isnan(tare_weight) || isnan(capacity) || isnan(regulator) || capacity <= 0.0f) {
        return NAN;
      }
      const float effective_empty = tare_weight + regulator;
      const float max_propane = capacity;
      const float remaining = weight - effective_empty;
      if (remaining < 0.0f) {
        return 0.0f;
      }
      if (remaining > max_propane) {
        return max_propane;
      }
      return remaining;
  - platform: template
    name: "Tank Percent Full"
    id: tank_percent_full
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      const float weight = id(tank_weight_kg).state;
      const bool tank_2_active = id(active_tank_profile).current_option() == "Tank 2";
      const float tare_weight = tank_2_active ? id(tank_2_tare_weight).state : id(tank_1_tare_weight).state;
      const float capacity = tank_2_active ? id(tank_2_capacity).state : id(tank_1_capacity).state;
      const float regulator = tank_2_active ? id(tank_2_regulator_weight).state : id(tank_1_regulator_weight).state;
      if (isnan(weight) || isnan(tare_weight) || isnan(capacity) || isnan(regulator) || capacity <= 0.0f) {
        return NAN;
      }
      const float effective_empty = tare_weight + regulator;
      const float max_propane = capacity;
      float fill = ((weight - effective_empty) / max_propane) * 100.0f;
      if (fill < 0.0f) {
        fill = 0.0f;
      }
      if (fill > 100.0f) {
        fill = 100.0f;
      }
      ESP_LOGI("tank_level", "Published tank percent: %.1f%% (active=%s)", fill, tank_2_active ? "Tank 2" : "Tank 1");
      return fill;
  - platform: template
    name: "Propane Fill Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(tank_percent_full).state;
