substitutions:
  name: propane-tank-monitor
  friendly_name: Propane Tank Monitor
  dout_pin: GPIO4
  clk_pin: GPIO5
  update_period_default_s: "5"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: huzzah

logger:

mqtt:
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: !secret mqtt_topic_prefix

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

web_server:
  port: 80

globals:
  - id: last_hx711_update_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: tare_offset_kg
    type: float
    restore_value: yes
    initial_value: "0.0"
  - id: propane_hist_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: propane_hist_0
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_1
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_2
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_3
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_4
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_5
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_6
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_7
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_8
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_9
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_10
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_11
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_12
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_13
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_14
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_15
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_16
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_17
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_18
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_19
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_20
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_21
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_22
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: propane_hist_23
    type: float
    restore_value: no
    initial_value: "-1.0"
  - id: last_low_propane_alarm_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

script:
  - id: emit_low_propane_alarm
    mode: restart
    then:
      - logger.log:
          level: WARN
          format: "Low propane alert emitted"
      - binary_sensor.template.publish:
          id: low_propane_alert
          state: ON
      - delay: 1s
      - binary_sensor.template.publish:
          id: low_propane_alert
          state: OFF

select:
  - platform: template
    name: "Active Tank"
    id: active_tank_profile
    optimistic: true
    restore_value: true
    initial_option: "TropiGas"
    options:
      - "TropiGas"
      - "PanaGas"

switch:
  - platform: template
    name: "Calibration Mode"
    id: calibration_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Tare Scale"
    id: tare_scale
    on_press:
      - lambda: |-
          if (isnan(id(tank_weight_kg).state)) {
            ESP_LOGW("tare", "Tare requested but current weight is not available yet");
            return;
          }
          id(tare_offset_kg) -= id(tank_weight_kg).state;
          ESP_LOGI("tare", "Tare applied. New tare offset: %.4f kg", id(tare_offset_kg));
          id(tank_weight_kg).update();

number:
  - platform: template
    name: "TropiGas Tare Weight"
    id: tank_1_tare_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 200
    step: 0.1
    initial_value: 6.35 
  - platform: template
    name: "TropiGas Capacity"
    id: tank_1_capacity
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 0.1
    initial_value: 11.34 
  - platform: template
    name: "TropiGas Regulator Weight"
    id: tank_1_regulator_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 20
    step: 0.01
    initial_value: 0.0
  - platform: template
    name: "PanaGas Tare Weight"
    id: tank_2_tare_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 200
    step: 0.1
    initial_value: 6.53 
  - platform: template
    name: "PanaGas Capacity"
    id: tank_2_capacity
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 0.1
    initial_value: 11.34 
  - platform: template
    name: "PanaGas Regulator Weight"
    id: tank_2_regulator_weight
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 20
    step: 0.01
    initial_value: 0.5
  - platform: template
    name: "Calibration Offset"
    id: calibration_offset_kg
    unit_of_measurement: kg
    optimistic: true
    restore_value: true
    min_value: -50
    max_value: 50
    step: 0.0001
    initial_value: 0.0
  - platform: template
    name: "Sensor Update Period"
    id: sensor_update_period_s
    unit_of_measurement: s
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 3600
    step: 1
    initial_value: ${update_period_default_s}
  - platform: template
    name: "Low Propane Alert Threshold"
    id: low_propane_alert_threshold_pct
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 10
  - platform: template
    name: "Low Propane Alarm Ignore Period"
    id: low_propane_alarm_ignore_period_min
    unit_of_measurement: min
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 1440
    step: 1
    initial_value: 120

interval:
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t period_ms = (uint32_t) (id(sensor_update_period_s).state * 1000.0f);
          const uint32_t safe_period_ms = period_ms < 1000 ? 1000 : period_ms;
          if ((now - id(last_hx711_update_ms)) >= safe_period_ms) {
            id(last_hx711_update_ms) = now;
            id(tank_weight_kg).update();
          }
  - interval: 1h
    then:
      - lambda: |-
          const float remaining = id(propane_remaining_kg).state;
          if (isnan(remaining) || remaining < 0.0f) {
            return;
          }

          id(propane_hist_23) = id(propane_hist_22);
          id(propane_hist_22) = id(propane_hist_21);
          id(propane_hist_21) = id(propane_hist_20);
          id(propane_hist_20) = id(propane_hist_19);
          id(propane_hist_19) = id(propane_hist_18);
          id(propane_hist_18) = id(propane_hist_17);
          id(propane_hist_17) = id(propane_hist_16);
          id(propane_hist_16) = id(propane_hist_15);
          id(propane_hist_15) = id(propane_hist_14);
          id(propane_hist_14) = id(propane_hist_13);
          id(propane_hist_13) = id(propane_hist_12);
          id(propane_hist_12) = id(propane_hist_11);
          id(propane_hist_11) = id(propane_hist_10);
          id(propane_hist_10) = id(propane_hist_9);
          id(propane_hist_9) = id(propane_hist_8);
          id(propane_hist_8) = id(propane_hist_7);
          id(propane_hist_7) = id(propane_hist_6);
          id(propane_hist_6) = id(propane_hist_5);
          id(propane_hist_5) = id(propane_hist_4);
          id(propane_hist_4) = id(propane_hist_3);
          id(propane_hist_3) = id(propane_hist_2);
          id(propane_hist_2) = id(propane_hist_1);
          id(propane_hist_1) = id(propane_hist_0);
          id(propane_hist_0) = remaining;

          if (id(propane_hist_count) < 24) {
            id(propane_hist_count) += 1;
          }
  - interval: 5s
    then:
      - lambda: |-
          const float pct = id(tank_percent_full).state;
          const float threshold = id(low_propane_alert_threshold_pct).state;
          const float ignore_period_min = id(low_propane_alarm_ignore_period_min).state;
          if (isnan(pct) || isnan(threshold) || isnan(ignore_period_min) || ignore_period_min <= 0.0f) {
            return;
          }

          if (pct > threshold) {
            return;
          }

          const uint32_t now = millis();
          const uint32_t ignore_period_ms = (uint32_t) (ignore_period_min * 60000.0f);
          const uint32_t elapsed = now - id(last_low_propane_alarm_ms);
          if (id(last_low_propane_alarm_ms) == 0 || elapsed >= ignore_period_ms) {
            id(last_low_propane_alarm_ms) = now;
            id(emit_low_propane_alarm).execute();
          }

sensor:
  - platform: hx711
    id: tank_weight_kg
    name: "Tank Weight"
    dout_pin: ${dout_pin}
    clk_pin: ${clk_pin}
    gain: 128
    update_interval: never
    unit_of_measurement: kg
    accuracy_decimals: 2
    filters:
      - calibrate_linear:
        - 169131.0 -> 0.0
        - 365592.0 -> 8.0
      - lambda: |-
          float adjusted = x;
          if (id(calibration_mode).state) {
            adjusted += id(calibration_offset_kg).state;
          }
          adjusted += id(tare_offset_kg);
          if (adjusted < 0) {
            return 0.0f;
          }
          return adjusted;
  - platform: template
    name: "Propane Remaining"
    id: propane_remaining_kg
    unit_of_measurement: kg
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      const float weight = id(tank_weight_kg).state;
      const bool tank_2_active = id(active_tank_profile).current_option() == "PanaGas";
      const float tare_weight = tank_2_active ? id(tank_2_tare_weight).state : id(tank_1_tare_weight).state;
      const float capacity = tank_2_active ? id(tank_2_capacity).state : id(tank_1_capacity).state;
      const float regulator = tank_2_active ? id(tank_2_regulator_weight).state : id(tank_1_regulator_weight).state;
      if (isnan(weight) || isnan(tare_weight) || isnan(capacity) || isnan(regulator) || capacity <= 0.0f) {
        return NAN;
      }
      const float tank_without_regulator = weight - regulator;
      const float propane_kg = tank_without_regulator - tare_weight;
      if (propane_kg < 0.0f) {
        return 0.0f;
      }
      if (propane_kg > capacity) {
        return capacity;
      }
      return propane_kg;
  - platform: template
    name: "Propane Used (24h)"
    id: propane_used_24h_kg
    unit_of_measurement: kg
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      const float current = id(propane_remaining_kg).state;
      if (isnan(current)) return NAN;
      const int count = id(propane_hist_count);
      if (count == 0) return NAN;
      float used, hours;
      if (count < 24) {
        // Less than 24h of data — extrapolate from the last 1h sample
        if (id(propane_hist_0) < 0.0f) return NAN;
        used = id(propane_hist_0) - current;
        hours = 1.0f;
      } else {
        // Full 24h window available
        if (id(propane_hist_23) < 0.0f) return NAN;
        used = id(propane_hist_23) - current;
        hours = 24.0f;
      }
      // Extrapolate to a 24-hour equivalent
      const float used_24h = (used / hours) * 24.0f;
      return (used_24h <= 0.0f) ? 0.0f : used_24h;
  - platform: template
    name: "Projected Days Remaining"
    id: projected_days_remaining
    unit_of_measurement: d
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      const float current = id(propane_remaining_kg).state;
      if (isnan(current)) return NAN;
      const int count = id(propane_hist_count);
      if (count == 0) return NAN;
      float used, hours;
      if (count < 24) {
        // Less than 24h of data — fall back to last 1h sample
        if (id(propane_hist_0) < 0.0f) return NAN;
        used = id(propane_hist_0) - current;
        hours = 1.0f;
      } else {
        // Full 24h window available
        if (id(propane_hist_23) < 0.0f) return NAN;
        used = id(propane_hist_23) - current;
        hours = 24.0f;
      }
      // No measurable consumption — tank has gas but rate is indeterminate; cap at 90d
      if (used <= 0.0f) return (current > 0.0f) ? 90.0f : NAN;
      const float rate_per_day = (used / hours) * 24.0f;
      const float projected_days = current / rate_per_day;
      return (projected_days > 90.0f) ? 90.0f : projected_days;
  - platform: template
    name: "Tank Percent Full"
    id: tank_percent_full
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      const float weight = id(tank_weight_kg).state;
      const bool tank_2_active = id(active_tank_profile).current_option() == "PanaGas";
      const float tare_weight = tank_2_active ? id(tank_2_tare_weight).state : id(tank_1_tare_weight).state;
      const float capacity = tank_2_active ? id(tank_2_capacity).state : id(tank_1_capacity).state;
      const float regulator = tank_2_active ? id(tank_2_regulator_weight).state : id(tank_1_regulator_weight).state;
      if (isnan(weight) || isnan(tare_weight) || isnan(capacity) || isnan(regulator) || capacity <= 0.0f) {
        return NAN;
      }
      const float tank_without_regulator = weight - regulator;
      const float propane_kg = tank_without_regulator - tare_weight;
      float fill = (propane_kg / capacity) * 100.0f;
      if (fill < 0.0f) {
        fill = 0.0f;
      }
      if (fill > 100.0f) {
        fill = 100.0f;
      }
      ESP_LOGI("tank_level", "Published tank percent: %.1f%% (active=%s)", fill, tank_2_active ? "PanaGas" : "TropiGas");
      return fill;
  - platform: template
    name: "Propane Fill Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(tank_percent_full).state;

binary_sensor:
  - platform: template
    name: "Low Propane"
    id: low_propane
    device_class: problem
    lambda: |-
      const float pct = id(tank_percent_full).state;
      const float threshold = id(low_propane_alert_threshold_pct).state;
      if (isnan(pct) || isnan(threshold)) {
        return false;
      }
      return pct <= threshold;
  - platform: template
    name: "Low Propane Alert"
    id: low_propane_alert
    device_class: problem
